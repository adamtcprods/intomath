[project]
name = "intomath-backend"
description = "IntoMath backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.14",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "sqlalchemy>=2.0.41",
  "alembic>=1.16.2",
  "psycopg[binary]>=3.2.9",
  "httpx>=0.28.1",

  "pillow>=11.0.0",
  "torch>=2.5.0",
  "transformers>=4.47.0",
  "pytest>=8.4.1",
  "openai>=2.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
