[project]
name = "intomath-backend"
version = "0.1.0"
description = "IntoMath backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.51",
  "psycopg[binary]>=3.3.4",
  "httpx>=0.28.1",

  "pillow>=12.3.0",
  "torch>=2.13.0",
  "transformers>=5.14.1",
  "openai>=2.53.0"
]

[project.optional-dependencies]
ocr = [
  "flash-attn==2.7.3",
]
dev = [
  "httpx2>=2.7.0",
  "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
